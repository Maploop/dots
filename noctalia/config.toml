[bar.default]
background_opacity = 0.69999998435378075
concave_edge_corners = false
end = [ "media", "tray", "network", "bluetooth", "volume", "battery", "session" ]
shadow = false
start = [ "workspaces" ]
thickness = 25

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
show_close_buttons = false

    [shell.launcher]
    categories = false
    compact = true
    layout = "simple"
    search_position = "top"
    show_app_origin_indicator = false

    [shell.screenshot]
    directory = "/home/leon/Pictures/Screenshots"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/leon/Pictures/Wallpapers"
directory_dark = "/home/leon/Pictures/Wallpapers"
directory_light = "/home/leon/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/leon/Pictures/Wallpapers/wallhaven-lyde92.jpg"

    [wallpaper.last]
    path = "/home/leon/Pictures/Wallpapers/wallhaven-lyde92.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/leon/Pictures/Wallpapers/wallhaven-lyde92.jpg"

[widget.workspaces]
occupied_color = "on_secondary"
style = "minimal"
