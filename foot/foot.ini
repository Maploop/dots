[main]
font=Iosevka Nerd Font:size=11
pad=5x5
initial-window-size-pixels=700x500

[cursor]
style=beam
unfocused-style=unchanged

[colors-dark]
# Background and foreground are used to style the beam cursor implicitly
foreground=c0caf5
background=08090d
selection-foreground=e6e9ff
selection-background=292d3e
regular0=11131a
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=c0caf5
bright0=292d3e
bright1=ff899d
bright2=b0e27a
bright3=f2c777
bright4=8db3ff
bright5=c7a9ff
bright6=8be3ff
bright7=e6e9ff

[key-bindings]
primary-paste=none

clipboard-copy=Control+Insert Control+Shift+c
clipboard-paste=Shift+Insert Control+Shift+v

font-increase=Control+equal
font-decrease=Control+minus
font-reset=Control+BackSpace
