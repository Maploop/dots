add_newline = true
command_timeout = 200

# --------------------------------------------------
# Prompt
# --------------------------------------------------

format = "[$username$hostname $directory$git_branch$git_status]($style) $character"


# --------------------------------------------------
# Character
# --------------------------------------------------

[character]
success_symbol = "[\\$](bold #5F87D7)"
error_symbol = "[\\$](bold #5F87D7)"


# --------------------------------------------------
# Directory
# --------------------------------------------------

[directory]
truncation_length = 2
truncation_symbol = "…/"
format = "[$path]($style)"
style = "#5F87D7"

repo_root_style = "bold #5F87D7"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# --------------------------------------------------
# Git branch
# --------------------------------------------------

[git_branch]
format = " \\[[$branch]($style)"
style = "cyan"


# --------------------------------------------------
# Git status
# --------------------------------------------------

[git_status]
format = "[$all_status]($style)\\]"
style = "red"

up_to_date = "✓"

ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "

conflicted = " "
untracked = "? "
modified = "* "
deleted = "* "

stashed = ""
staged = ""
renamed = ""


# --------------------------------------------------
# Username
# --------------------------------------------------

[username]
show_always = true
format = "[$user]($style)"
style_user = "red"
style_root = "red"


# --------------------------------------------------
# Hostname
# --------------------------------------------------

[hostname]
ssh_only = false
format = "[@](#FFFFFF)[$hostname]($style)"
style = "blue"
